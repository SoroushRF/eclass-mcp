# E01 + E02 — CI, lint, test (see docs/PROJECT_MASTER.md §2.9.1)
name: CI
on:
  push:
    branches: [master]
  pull_request:
    # Include feature branches so stacked PRs get CI before retargeting to master.
    branches: [master, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-independent checks run once instead of in every matrix cell.
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Package dry run
        run: npm pack --dry-run

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary desktop-host platform. Node 20.x covers the
        # `engines` floor (>=20.19.0); 22.x and 24.x are the current LTS lines.
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
        include:
          - os: ubuntu-latest
            node-version: 20.x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (coverage)
        run: npm run test:coverage

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Runtime dependencies only: this server handles session cookies and
      # mobile tokens and parses downloaded course files.
      - name: npm audit (runtime, high+)
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The action needs the repository's Dependency graph setting. Detect it
      # instead of failing every PR while the setting is off.
      - name: Check dependency graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dependency review skipped::Enable Settings → Code security → Dependency graph to review dependency changes on pull requests. The Security audit job still runs."
          fi

      - uses: actions/checkout@v4
        if: steps.graph.outputs.enabled == 'true'

      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
